name: Build, test, deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache engine dependencies (wasi-sdk, NAM core, Eigen)
        uses: actions/cache@v4
        with:
          path: |
            .deps/wasi-sdk
            .deps/NeuralAmpModelerCore
            .deps/eigen
          key: deps-${{ runner.os }}-${{ hashFiles('wasm/deps.env') }}

      - name: Fetch pinned dependencies
        run: bash wasm/fetch-deps.sh

      - name: Build nam.wasm from NeuralAmpModelerCore
        run: JOBS=4 bash wasm/build.sh

      - name: Build native reference (official core)
        run: npm run build:ref

      - name: Install test tools
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Fidelity — wasm vs native core, every example model
        run: npm run test:fidelity

      - name: End-to-end — engine, loader, MIDI, presets, alignment, tuner
        run: npm run test:e2e

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: profondo-app
          path: app/

  deploy:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: profondo-app
          path: app/
      - name: Deploy to Cloudflare Workers
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Cloudflare not configured
        if: env.CF_TOKEN == ''
        run: echo "::notice::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable deploys."

  release:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: profondo-app
          path: app/
      - name: Package
        run: |
          mkdir -p dist/Profondo
          cp -r app README.md LICENSE THIRD_PARTY.md "Avvia Profondo (Mac).command" "Start Profondo (Windows).bat" start-linux.sh dist/Profondo/
          chmod +x "dist/Profondo/Avvia Profondo (Mac).command" dist/Profondo/start-linux.sh
          cd dist && zip -qr "Profondo-${GITHUB_REF_NAME}.zip" Profondo
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/Profondo-*.zip
          generate_release_notes: true
